<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CoolRPG Web</title><style>
:root{--bg:#141724;--card:#1e2338;--tx:#f2f5ff;--mu:#a6b3cc;--ac:#5ac0ff;--ok:#40d972;--dg:#f25a5a;--bd:#2e3a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Segoe UI Emoji","Segoe UI Symbol",sans-serif;transition:background .4s;perspective:1100px}
button,.btn,.tile,input,select,.card,.hud,.arena{font-family:inherit}.hud,.card,.tile,.arena{box-shadow:0 10px 24px #0007, inset 0 1px 0 #ffffff12;transform:translateZ(0);backface-visibility:hidden}.tile{position:relative;transform:translateY(0) rotateX(0);box-shadow:0 8px 0 #0005,0 14px 26px #0006,inset 0 1px 0 #ffffff20}.tile:hover{transform:translateY(-5px) rotateX(3deg);box-shadow:0 12px 0 #0005,0 20px 30px #0007,inset 0 1px 0 #ffffff25}.tile:active{transform:translateY(2px) scale(.98);box-shadow:0 3px 0 #0006,0 7px 12px #0006}.card{transform:translateY(0);transition:transform .16s,box-shadow .16s,border-color .16s}.card:hover{transform:translateY(-2px);box-shadow:0 14px 28px #0008,inset 0 1px 0 #ffffff18}button,.btn{box-shadow:0 5px 0 #0005,0 8px 16px #0004,inset 0 1px 0 #ffffff35}button:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #0005,0 12px 20px #0005,inset 0 1px 0 #ffffff40}button:active,.btn:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 #0006,0 4px 8px #0005}.spr{filter:drop-shadow(0 10px 8px #0008);text-shadow:0 5px 12px #0009}
.emoji3d{display:inline-block;filter:drop-shadow(0 6px 4px #0008);transform:translateZ(18px)}
#app{max-width:600px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{margin:6px 0}.mu{color:var(--mu);font-size:13px}
.hud{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.hud .av{font-size:34px}.hud .gr{flex:1}.coin{font-weight:700;color:#ffd447}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(160deg,var(--card),var(--bg));border:1px solid var(--bd);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;color:var(--tx);font:inherit;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-3px);border-color:var(--ac)}.tile b{display:block;font-size:30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
button,.btn{font:inherit;background:var(--ac);color:#08101c;font-weight:700;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .1s,filter .1s}
button:hover,.btn:hover{filter:brightness(1.12)}button:active{transform:scale(.95)}button:disabled{opacity:.35;cursor:default}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.back{margin:4px 0 8px}
input,select,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;box-sizing:border-box;margin:5px 0}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--bd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ac);margin-top:-7px;cursor:pointer;box-shadow:0 2px 6px #0006}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--bd)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--ac);cursor:pointer}
.arena{position:relative;background:radial-gradient(circle at 50% 30%,var(--card),var(--bg));border:1px solid var(--bd);border-radius:16px;padding:12px;overflow:hidden;min-height:400px}
.side{text-align:center;padding:6px}.spr{font-size:78px;line-height:1.1;display:inline-block;animation:bob 2.2s ease-in-out infinite}
.bar{height:14px;background:#0006;border-radius:8px;overflow:hidden;margin:4px auto;max-width:300px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#2fbf60,var(--ok));transition:width .45s ease-out}.bar.e i{background:linear-gradient(90deg,#c0392b,var(--dg))}
.acts{display:flex;gap:8px;justify-content:center;margin-top:10px}.acts button{flex:1;padding:14px}
.pop{position:absolute;font-weight:800;font-size:26px;pointer-events:none;text-shadow:0 2px 6px #000;animation:fl 1s ease-out forwards;z-index:5}
.pop.dmg{color:#ff6b6b}.pop.crit{color:#ffd447;font-size:34px}.pop.heal{color:#5dffa0}.pop.spark{font-size:30px}
.ov{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:9;animation:in .3s}
.hit{animation:hit .35s}.lu{animation:lu .3s}.ld{animation:ld .3s}.glow{animation:glow .6s}.shake{animation:shake .3s}.ko{animation:ko .8s forwards}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes fl{to{transform:translateY(-80px) scale(1.2);opacity:0}}
@keyframes in{from{opacity:0}}
@keyframes hit{20%{transform:translateX(-12px);filter:brightness(2) sepia(1) hue-rotate(-40deg) saturate(6)}50%{transform:translateX(12px)}}
@keyframes lu{50%{transform:translateY(-50px) scale(1.15)}}@keyframes ld{50%{transform:translateY(50px) scale(1.15)}}
@keyframes glow{50%{filter:drop-shadow(0 0 22px #5dffa0) brightness(1.3)}}
@keyframes shake{25%{transform:translate(-6px,4px)}75%{transform:translate(6px,-4px)}}
@keyframes ko{to{transform:rotate(80deg) translateY(40px);opacity:.15}}

.flash{animation:flash .25s ease-out}@keyframes flash{0%{filter:brightness(2)}100%{filter:none}}
.critflash{animation:critflash .35s}@keyframes critflash{0%{filter:brightness(2.2) saturate(2)}50%{filter:hue-rotate(-20deg)}100%{filter:none}}
.slashfx{position:absolute;left:50%;top:35%;width:120px;height:6px;margin-left:-60px;background:linear-gradient(90deg,transparent,#fff,transparent);border-radius:4px;opacity:0;pointer-events:none;z-index:6}
.slashfx.on{animation:slash 0.35s ease-out}@keyframes slash{0%{opacity:1;transform:rotate(-25deg) scaleX(.2)}60%{opacity:1;transform:rotate(-25deg) scaleX(1.2)}100%{opacity:0;transform:rotate(-25deg) scaleX(1.4) translateX(20px)}}
.boomfx{position:absolute;left:50%;top:30%;width:20px;height:20px;margin:-10px;border-radius:50%;background:#ff6b35;opacity:0;pointer-events:none;z-index:6}
.boomfx.on{animation:boom 0.5s ease-out}@keyframes boom{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(6)}}
.healfx{position:absolute;left:50%;bottom:28%;font-size:28px;opacity:0;pointer-events:none;z-index:6;animation:none}
.healfx.on{animation:healup .7s ease-out}@keyframes healup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.tile:hover{animation:none}

.arena{isolation:isolate;box-shadow:0 12px 35px #0005;transition:transform .2s,box-shadow .2s}
.spr{will-change:transform,filter;transform-origin:50% 70%}

.ld{animation:ld2 .34s cubic-bezier(.2,.8,.2,1)}

function start(){const n=g('nm').value.trim();if(!n)return;P=fresh(n,g('cl').value);norm();save();draw()}
const buy=n=>{const w=D.weapons[n];if(P.coins>=w.price){P.coins-=w.price;P.inv.push(n);SFX.buy();save();draw()}else SFX.error()};
function rickUp(k,cost,amt){if((P.rc||0)<cost){SFX.error();return}P.rc-=cost;if(k==='hp'){P.hp+=amt}else if(k==='dmg'){P.dmg+=amt}else{P.heal+=amt}SFX.buy();SFX.rick();save();draw()}
function rickBuyWpn(n,cost){if((P.rc||0)<cost||P.inv.includes(n)){SFX.error();return}P.rc-=cost;P.inv.push(n);SFX.buy();SFX.rick();save();draw()}

const wear=n=>{const a=D.armor[n];if(P.coins>=a.price){P.coins-=a.price;P.armor=n;SFX.equip();save();draw()}else SFX.error()};
const upg=k=>{const c=upCost(k);if(P.coins<c){SFX.error();return}P.coins-=c;P.lv[k]++;if(k=='hp')P.hp+=25;else P[k]+=5;SFX.buy();save();draw()};
function unlock(k){const [n,c,rq,e]=SK[k];if(P.sk.pts<c||P.sk.un.includes(k))return;P.sk.pts-=c;P.sk.un.push(k);
 if(e.hp)P.hp=Math.max(1,P.hp+e.hp);if(e.d)P.dmg+=e.d;if(e.h)P.heal+=e.h;if(e.ar)P.sk.ar+=e.ar;if(e.cr)P.sk.cr+=e.cr;if(e.m)P.sk.m*=e.m;SFX.unlock();save();draw()}
function claim(id){const x=P.q.list.find(y=>y.id==id);if(x&&!x.done&&x.p>=x.t){x.done=true;P.coins+=x.r;save();draw()}}
function setNG(){const el=g('nglv');const lv=Math.max(0,Math.min(999999,Math.floor(Number(el&&el.value)||0)));P.ng.lv=lv;P.ng.on=lv>0;save();SFX.unlock();draw()}

/* ===== Multiplayer: 5-digit room code via PeerJS ===== */
let peer=null,dc=null,MP=null,isHost=false,mpCode='',mpStatus='';
const send=m=>{try{if(dc&&dc.open)dc.send(JSON.stringify(m))}catch(e){}};
function mpCleanup(){
  try{if(dc){dc.close()}}catch(e){}
  try{if(peer){peer.destroy()}}catch(e){}
  peer=dc=null;MP=null;mpCode='';mpStatus='';
}
function wireConn(conn){
  dc=conn;
  conn.on('open',()=>{
    mpStatus='Connected!';
    MP=MP||{hp:eff().hp,op:null,turn:isHost,over:false};
    send({t:'hi',n:P.name,c:P.cls,e:eff()});
    SFX.win();
  });
  conn.on('data',d=>{
    try{onMsg(typeof d==='string'?JSON.parse(d):d)}catch(e){}
  });
  conn.on('close',()=>{
    if(MP&&!MP.over){MP.over=true;SFX.lose();alert('Your friend disconnected.');go('mp')}
  });
  conn.on('error',err=>{mpStatus='Connection error';draw()});
}
function mpHost(){
  if(typeof Peer==='undefined'){alert('PeerJS failed to load. Check your internet connection.');return}
  mpCleanup();
  isHost=true;
  mpCode=String(Math.floor(10000+Math.random()*90000));
  mpStatus='Creating room '+mpCode+'…';
  view='mphost';draw();SFX.ui();
  try{
    peer=new Peer('coolrpg-'+mpCode,{debug:0});
    peer.on('open',id=>{mpStatus='Room ready — share code '+mpCode;draw();SFX.click()});
    peer.on('connection',conn=>{wireConn(conn);mpStatus='Friend joining…';draw()});
    peer.on('error',err=>{
      // ID taken → new code
      if(String(err).includes('taken')|| (err&&err.type==='unavailable-id')){
        mpCode=String(Math.floor(10000+Math.random()*90000));
        peer.destroy();
        peer=new Peer('coolrpg-'+mpCode,{debug:0});
        peer.on('open',()=>{mpStatus='Room ready — share code '+mpCode;draw()});
        peer.on('connection',conn=>wireConn(conn));
      } else {
        mpStatus='Could not host: '+(err&&err.message?err.message:err);
        draw();
      }
    });
  }catch(e){mpStatus='Host failed: '+e.message;draw()}
}
function mpJoinCode(){
  if(typeof Peer==='undefined'){alert('PeerJS failed to load. Check your internet connection.');return}
  const el=g('jcode');
  let code=(el&&el.value||'').replace(/\D/g,'').slice(0,5);
  if(code.length!==5){alert('Enter the 5-digit room code from your friend.');return}
  mpCleanup();
  isHost=false;mpCode=code;mpStatus='Connecting to '+code+'…';view='mpjoin';draw();SFX.ui();
  try{
    peer=new Peer({debug:0});
    peer.on('open',()=>{
      const conn=peer.connect('coolrpg-'+code,{reliable:true});
      wireConn(conn);
      mpStatus='Waiting for host…';
      draw();
    });
    peer.on('error',err=>{mpStatus='Join failed: '+(err&&err.message?err.message:err);draw();SFX.lose()});
  }catch(e){mpStatus='Join failed: '+e.message;draw()}
}
function onMsg(m){
  MP=MP||{hp:eff().hp,op:null,turn:isHost,over:false};
  if(m.t=='hi'){
    MP.op={name:m.n,cls:m.c,hp:m.e.hp,max:m.e.hp};
    // exchange stats both ways
    if(!isHost) send({t:'hi',n:P.name,c:P.cls,e:eff()});
    view='mpbattle';lock=false;draw();SFX.win();
  } else if(m.t=='a'){
    MP.hp=Math.max(0,MP.hp-m.d);
    fx('es','lu');
    setTimeout(()=>{fx('ps','hit');pop('ps',(m.c?' ':'-')+F(m.d),m.c?'crit':'dmg');if(m.c)fx('ar','shake');SFX.hit();if(m.c)SFX.crit()},150);
    MP.turn=true;mpUpd();
    if(MP.hp<=0)mpEnd(false);
  } else if(m.t=='h'){
    MP.op.hp=Math.min(MP.op.max,MP.op.hp+m.h);
    fx('es','glow');pop('es','+'+F(m.h),'heal');SFX.heal();
    MP.turn=true;mpUpd();
  } else if(m.t==='modeReq'&&isHost){startMPMode(m.mode)} else if(m.t==='coopStart'){MP.mode=m.mode;MP.coop=true;MP.enemy={...m.e};MP.aHp=m.aHp;MP.bHp=m.bHp;MP.turn=m.turn;view='mpcoop';lock=false;draw();mpCoopUpd();SFX.unlock()} else if(m.t==='coopAct'){
    MP.enemy.hp=Math.max(0,MP.enemy.hp-(m.d||0));
    if(m.h){if(m.from==='a')MP.aHp=Math.min(eff().hp,MP.aHp+m.h);else MP.bHp=Math.min(MP.op.max,MP.bHp+m.h)}
    if(m.from!==(isHost?'a':'b')){if(m.d){fx('es','hit');pop('es','-'+F(m.d),'dmg');SFX.hit()}if(m.h){fx('glow');SFX.heal()}}
    if(isHost&&MP.enemy.hp>0){const target=Math.random()<.5?'a':'b';const ed=Math.max(1,Math.round(MP.enemy.damage*R(.85,1.05)));if(target==='a')MP.aHp=Math.max(0,MP.aHp-ed);else MP.bHp=Math.max(0,MP.bHp-ed);send({t:'coopEnemy',target,d:ed});if((target==='a'?MP.aHp:MP.bHp)<=0){send({t:'coopEnd',win:false});mpCoopEnd(false);return}}
    MP.turn=true;mpCoopUpd()
  } else if(m.t==='coopEnemy'){if(m.target==='a')MP.aHp=Math.max(0,MP.aHp-m.d);else MP.bHp=Math.max(0,MP.bHp-m.d);SFX.hit();mpCoopUpd();MP.turn=true} else if(m.t==='coopTurn'){MP.turn=m.turn;mpCoopUpd()} else if(m.t==='coopEnd'){mpCoopEnd(m.win)}
}
function mpModeCard(name){return `<div class="card" style="display:block;text-align:center"><h2>${name}</h2><p class="mu">${name==='PvP'?'Player versus player.':'Two-player cooperative battle.'}</p>${btn('Start '+name,`startMPMode('${name}')`)}</div>`}
function startMPMode(name){if(!MP||!MP.op)return;MP.mode=name;MP.over=false;MP.coop=name!=='PvP';if(name==='PvP'){MP.turn=isHost;view='mpfight';draw();SFX.unlock();return}if(isHost){const src=name==='Rick and Morty'?D.rickEnemies: D.normalEnemies;let e;if(name==='Endless'){const c=D.endless.Hard;e={name:'Endless Wave 1',hp:c.hp,damage:c.damage,heal:Math.round(c.hp*.05),reward:c.reward}}else if(name==='Raid'){const r=RD[0];e={name:r[0],hp:r[1],damage:r[2],heal:r[3],reward:r[7]}}else{e={...(src[1]||D.normalEnemies[1])}}MP.enemy={...e,max:e.hp};MP.aHp=eff().hp;MP.bHp=MP.op.hp;MP.turn=true;send({t:'coopStart',mode:name,e:MP.enemy,aHp:MP.aHp,bHp:MP.bHp,turn:true});view='mpcoop';draw();SFX.unlock()}else{send({t:'modeReq',mode:name});mpStatus='Waiting for host to start '+name+'…';draw();SFX.ui()}}
function mpCoopHtml(){const e=MP.enemy;return `<div class="arena" id="ar"><div class="side"><b>${e.name}</b><div class="bar e"><i id="eb"></i></div><div class="mu" id="et"></div><div class="spr" id="es">${sprite(e.name)}</div></div><div class="grid" style="margin-top:8px"><div class="card"><b>${isHost?'Host':'Player 2'}</b><br><span class="mu">${P.name}</span><div class="bar"><i id="ab"></i></div><span class="mu" id="at"></span></div><div class="card"><b>${MP.op.name}</b><br><span class="mu">${MP.op.name}</span><div class="bar"><i id="bb"></i></div><span class="mu" id="bt"></span></div></div><div class="mu" id="tn" style="text-align:center;margin:10px"></div><div class="acts"><button onclick="mpCoopAct('atk')">⚔️ Attack</button><button onclick="mpCoopAct('heal')">💚 Heal</button><button class="g" onclick="go('mp')">Leave</button></div></div>`}
function mpCoopUpd(){if(!MP||!MP.enemy)return;const p=eff(),e=MP.enemy;if(g('eb'))g('eb').style.width=Math.max(0,e.hp/e.max*100)+'%';if(g('et'))g('et').textContent=F(e.hp)+' / '+F(e.max);if(g('ab'))g('ab').style.width=Math.max(0,MP.aHp/p.hp*100)+'%';if(g('at'))g('at').textContent=F(MP.aHp)+' / '+F(p.hp);if(g('bb'))g('bb').style.width=Math.max(0,MP.bHp/MP.op.max*100)+'%';if(g('bt'))g('bt').textContent=F(MP.bHp)+' / '+F(MP.op.max);if(g('tn'))g('tn').textContent=MP.over?'':MP.turn?'Your turn':'Waiting for the other player'}
async function mpCoopAct(k){if(!MP||!MP.coop||!MP.turn||MP.over||lock)return;lock=true;const p=eff();let d=0,h=0;if(k==='atk'){d=Math.max(1,Math.round(p.dmg*R(.9,1.1)));MP.enemy.hp=Math.max(0,MP.enemy.hp-d);fx('ps','lu');await sl(120);fx('es','hit');pop('es','-'+F(d),'dmg');wpnSound()}else{const ownHp=isHost?MP.aHp:MP.bHp;h=Math.max(0,Math.min(p.heal,p.hp-ownHp));if(isHost)MP.aHp+=h;else MP.bHp+=h;fx('ps','glow');pop('ps','+'+F(h),'heal');SFX.heal()}send({t:'coopAct',k,d,h,from:isHost?'a':'b'});if(MP.enemy.hp<=0){send({t:'coopEnd',win:true});mpCoopEnd(true);return}if(isHost){const target=Math.random()<.5?'a':'b';const ed=Math.max(1,Math.round(MP.enemy.damage*R(.85,1.05)));if(target==='a')MP.aHp=Math.max(0,MP.aHp-ed);else MP.bHp=Math.max(0,MP.bHp-ed);send({t:'coopEnemy',target,d:ed});if((target==='a'?MP.aHp:MP.bHp)<=0){send({t:'coopEnd',win:false});mpCoopEnd(false);return}}MP.turn=false;send({t:'coopTurn',turn:false});mpCoopUpd();lock=false}
function mpCoopEnd(w){if(!MP||MP.over)return;MP.over=true;lock=false;if(w){P.coins+=Math.round((MP.enemy.reward||100)*P.pr.r);P.st.wins++;SFX.win()}else{P.st.losses++;SFX.lose()}save();const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<h2>${w?'🏆 VICTORY':'💀 DEFEATED'}</h2><p>${w?'+ '+F(MP.enemy.reward||100):'The team was defeated.'}</p><button onclick="go('mpbattle')">Continue</button>`;setTimeout(()=>g('ar')&&g('ar').appendChild(ov),350)}
function mpHtml(){
  return`<div class="arena" id="ar"><div class="side"><b>${MP.op.name}</b> <span class="mu">${MP.op.cls}</span><div class="bar e"><i id="eb"></i></div><div class="mu" id="et"></div><div class="spr" id="es">${AV[MP.op.cls]||''}</div></div><div class="side"><div class="spr" id="ps">${AV[P.cls]}</div><div class="bar"><i id="pb"></i></div><div class="mu" id="pt"></div><b>${P.name}</b></div><div class="mu" id="tn" style="text-align:center"></div><div class="acts"><button onclick="mpAct('atk')">⚔️ Attack</button><button onclick="mpAct('heal')"> Heal</button><button class="g" onclick="go('mp')">Quit</button></div></div>`
}
function mpUpd(){
  const p=eff();
  if(g('eb'))g('eb').style.width=MP.op.hp/MP.op.max*100+'%';
  if(g('et'))g('et').textContent=F(MP.op.hp)+' / '+F(MP.op.max);
  if(g('pb'))g('pb').style.width=MP.hp/p.hp*100+'%';
  if(g('pt'))g('pt').textContent=F(MP.hp)+' / '+F(p.hp);
  if(g('tn'))g('tn').textContent=MP.over?'':MP.turn?'Your turn!':'Waiting for '+MP.op.name+'…';
}
async function mpAct(k){
  if(!MP||!MP.turn||MP.over||lock)return;lock=true;const p=eff();
  if(k=='atk'){
    let d=Math.round(p.dmg*R(.85,1.15)),c=Math.random()<crit();if(c)d*=2;
    MP.op.hp=Math.max(0,MP.op.hp-d);send({t:'a',d,c});
    fx('ps','lu');await sl(150);fx('es','hit');pop('es',(c?' ':'-')+F(d),c?'crit':'dmg');
    if(c){fx('ar','shake');SFX.crit()}else wpnSound();
  } else {
    const h=Math.max(0,Math.min(p.heal,p.hp-MP.hp));MP.hp+=h;send({t:'h',h});
    fx('ps','glow');pop('ps','+'+F(h),'heal');SFX.heal();
  }
  MP.turn=false;mpUpd();lock=false;if(MP.op.hp<=0)mpEnd(true);
}
function mpEnd(w){
  MP.over=true;if(w){P.coins+=300;P.st.wins++;SFX.win()}else{P.st.losses++;SFX.lose()}
  save();fx(w?'es':'ps','ko');
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<h2>${w?' YOU WIN':' YOU LOST'}</h2><p>${w?'+ 300':'Good fight!'}</p><button onclick="go('mp')">Continue</button>`;
  setTimeout(()=>g('ar')&&g('ar').appendChild(ov),700);
}

function initStars(){const box=document.getElementById('stars');if(!box||box.childElementCount)return;for(let i=0;i<40;i++){const st=document.createElement('div');st.className='star';st.style.left=Math.random()*100+'%';st.style.top=Math.random()*100+'%';st.style.animationDelay=(Math.random()*6)+'s';st.style.opacity=0.2+Math.random()*0.5;box.appendChild(st)}}
document.addEventListener('pointerdown',e=>{ensureAudio();const b=e.target.closest&&e.target.closest('button,.btn,.tile');if(b&&!b.dataset.silent){SFX.click()}},{passive:true});
initStars();
draw();
</script></body></html>
